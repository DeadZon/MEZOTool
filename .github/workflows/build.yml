name: Build DeadZone Flash Tool

env:
  SCRCPY_VERSION: v3.3.4
  PLATFORM_TOOLS_CACHE_VERSION: latest

on:
  push:
    tags:
      - 'v*'           # Automatically build when pushing a tag, e.g. v1.0.0
  workflow_dispatch:     # Allow manual runs from the GitHub UI
    inputs:
      release_tag:
        description: 'Release tag (e.g. v1.0.0). Leave empty to skip release creation.'
        required: false
        default: ''

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: DeadZone-Windows
            exe_name: DeadZone.exe
            platform_tools_urls: https://dl.google.com/android/repository/platform-tools-latest-windows.zip https://dl-ssl.google.com/android/repository/platform-tools-latest-windows.zip
            scrcpy_arch: win64
            scrcpy_ext: zip
            separator: ";"

          - os: ubuntu-latest
            artifact_name: DeadZone-Linux
            exe_name: DeadZone
            platform_tools_urls: https://dl.google.com/android/repository/platform-tools-latest-linux.zip
            scrcpy_arch: linux-x86_64
            scrcpy_ext: tar.gz
            separator: ":"

          - os: macos-latest
            artifact_name: DeadZone-macOS-arm64
            exe_name: DeadZone
            platform_tools_urls: https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
            scrcpy_arch: macos-aarch64
            scrcpy_ext: tar.gz
            separator: ":"

          - os: macos-15-intel
            artifact_name: DeadZone-macOS-x64
            exe_name: DeadZone
            platform_tools_urls: https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
            scrcpy_arch: macos-x86_64
            scrcpy_ext: tar.gz
            separator: ":"

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-Fluent-Widgets darkdetect pyinstaller

      - name: Cache downloaded tools
        uses: actions/cache@v4
        with:
          path: .ci-cache
          key: tools-${{ runner.os }}-${{ matrix.scrcpy_arch }}-platform-tools-${{ env.PLATFORM_TOOLS_CACHE_VERSION }}-scrcpy-${{ env.SCRCPY_VERSION }}

      # Linux: install required GUI libraries
      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-xinerama0 libxcb-cursor0 libegl1 libxkbcommon0

      - name: Get qfluentwidgets path
        id: qfw
        shell: python
        run: |
          import os, qfluentwidgets
          path = os.path.dirname(qfluentwidgets.__file__)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"path={path}\n")

      - name: Get darkdetect path
        id: dd
        shell: python
        run: |
          import os, darkdetect
          path = os.path.dirname(darkdetect.__file__)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"path={path}\n")

      - name: Generate macOS icon
        if: runner.os == 'macOS'
        run: |
          ICON_DIR="assets/icons"
          ICNS_PATH="${ICON_DIR}/deadzone_logo.icns"
          ICONSET_PATH="${ICON_DIR}/deadzone_logo.iconset"
          SOURCE_PNG=""

          if [ -f "$ICNS_PATH" ]; then
            echo "Using existing ${ICNS_PATH}"
            exit 0
          fi

          if [ -f "${ICON_DIR}/deadzone_logo_1024.png" ]; then
            SOURCE_PNG="${ICON_DIR}/deadzone_logo_1024.png"
          elif [ -f "${ICON_DIR}/deadzone_logo.png" ]; then
            SOURCE_PNG="${ICON_DIR}/deadzone_logo.png"
          else
            echo "No PNG source found for macOS icon; building without an icon."
            exit 0
          fi

          rm -rf "$ICONSET_PATH"
          mkdir -p "$ICONSET_PATH"

          make_icon() {
            size="$1"
            name="$2"
            if ! sips -z "$size" "$size" "$SOURCE_PNG" --out "${ICONSET_PATH}/${name}" >/dev/null; then
              echo "WARNING: failed to generate ${name}; building without an icon."
              rm -rf "$ICONSET_PATH"
              exit 0
            fi
          }

          make_icon 16 icon_16x16.png
          make_icon 32 icon_16x16@2x.png
          make_icon 32 icon_32x32.png
          make_icon 64 icon_32x32@2x.png
          make_icon 128 icon_128x128.png
          make_icon 256 icon_128x128@2x.png
          make_icon 256 icon_256x256.png
          make_icon 512 icon_256x256@2x.png
          make_icon 512 icon_512x512.png
          make_icon 1024 icon_512x512@2x.png

          if iconutil -c icns "$ICONSET_PATH" -o "$ICNS_PATH"; then
            echo "Generated ${ICNS_PATH}"
          else
            echo "WARNING: iconutil failed; building without an icon."
          fi
          rm -rf "$ICONSET_PATH"

      - name: Build with PyInstaller
        shell: python
        env:
          QFW_PATH: ${{ steps.qfw.outputs.path }}
          DD_PATH: ${{ steps.dd.outputs.path }}
          DATA_SEPARATOR: ${{ matrix.separator }}
        run: |
          import os
          import subprocess
          import sys

          sep = os.environ["DATA_SEPARATOR"]
          cmd = [
              sys.executable, "-m", "PyInstaller",
              "--noconfirm", "--onefile", "--name", "DeadZone", "--noconsole",
          ]

          if sys.platform == "win32":
              icon = "assets/icons/deadzone_logo.ico"
              if os.path.isfile(icon):
                  cmd += ["--icon", icon]
          elif sys.platform == "darwin":
              icon = "assets/icons/deadzone_logo.icns"
              if os.path.isfile(icon):
                  cmd += ["--icon", icon]

          if os.path.isdir("assets"):
              cmd += ["--add-data", f"assets{sep}assets"]

          cmd += [
              "--add-data", f"{os.environ['QFW_PATH']}{sep}qfluentwidgets",
              "--add-data", f"{os.environ['DD_PATH']}{sep}darkdetect",
              "--hidden-import", "PyQt6.QtCore",
              "--hidden-import", "PyQt6.QtGui",
              "--hidden-import", "PyQt6.QtWidgets",
              "--hidden-import", "PyQt6.QtSvg",
              "--hidden-import", "PyQt6.QtSvgWidgets",
              "--hidden-import", "qfluentwidgets",
              "--hidden-import", "darkdetect",
              "--exclude-module", "tkinter",
              "--exclude-module", "unittest",
              "--exclude-module", "pydoc",
              "--exclude-module", "doctest",
              "--exclude-module", "lib2to3",
              "--exclude-module", "matplotlib",
              "--exclude-module", "numpy",
              "--exclude-module", "pandas",
              "--exclude-module", "scipy",
              "app.py",
          ]
          print(" ".join(cmd))
          subprocess.check_call(cmd)

      # Download platform-tools for each OS
      - name: Download platform-tools
        shell: python
        run: |
          import os
          import shutil
          import time
          import urllib.error
          import urllib.request
          import zipfile

          urls = "${{ matrix.platform_tools_urls }}".split()
          cache_dir = os.path.join(".ci-cache", "platform-tools")
          os.makedirs(cache_dir, exist_ok=True)
          zip_path = os.path.join(cache_dir, f"platform-tools-latest-{os.name}.zip")
          adb_name = "adb.exe" if os.name == "nt" else "adb"
          fastboot_name = "fastboot.exe" if os.name == "nt" else "fastboot"
          required_files = [
              os.path.join("dist", "platform-tools", adb_name),
              os.path.join("dist", "platform-tools", fastboot_name),
          ]
          attempts_log = []

          def download_with_retries(download_url, output_path, attempts=3):
              headers = {"User-Agent": "DeadZone-CI"}
              for attempt in range(1, attempts + 1):
                  if os.path.exists(output_path):
                      os.remove(output_path)
                  try:
                      print(f"Downloading {download_url} (attempt {attempt}/{attempts})...")
                      req = urllib.request.Request(download_url, headers=headers)
                      with urllib.request.urlopen(req, timeout=60) as response:
                          with open(output_path, "wb") as target:
                              shutil.copyfileobj(response, target)
                      if os.path.getsize(output_path) <= 0:
                          raise RuntimeError(f"Downloaded file is empty: {output_path}")
                      attempts_log.append((download_url, "OK"))
                      return True
                  except urllib.error.HTTPError as exc:
                      attempts_log.append((download_url, f"HTTP {exc.code}: {exc.reason}"))
                      print(f"WARNING: HTTP {exc.code} while downloading {download_url}: {exc.reason}")
                      if exc.code == 403:
                          print("WARNING: rate limit or access denial encountered; retrying platform-tools download.")
                  except Exception as exc:
                      attempts_log.append((download_url, f"ERROR: {exc}"))
                      print(f"WARNING: download failed: {exc}")
                  if os.path.exists(output_path):
                      os.remove(output_path)
                  if attempt < attempts:
                      time.sleep(5 * attempt)
              return False

          def attempted_urls_message():
              lines = ["Attempted platform-tools URLs:"]
              lines.extend(f"- {url}: {status}" for url, status in attempts_log)
              return "\n".join(lines)

          def download_any(output_path):
              for candidate_url in urls:
                  if download_with_retries(candidate_url, output_path):
                      return True
              return False

          def extracted_files_exist():
              return all(os.path.isfile(path) for path in required_files)

          if extracted_files_exist():
              print("platform-tools already extracted.")
              raise SystemExit(0)

          if not os.path.isfile(zip_path) or os.path.getsize(zip_path) <= 0:
              if not download_any(zip_path):
                  raise RuntimeError(
                      "Required platform-tools archive could not be downloaded.\n"
                      + attempted_urls_message()
                  )
          else:
              print(f"Using cached {zip_path}")

          for attempt in range(1, 4):
              shutil.rmtree(os.path.join("dist", "platform-tools"), ignore_errors=True)
              try:
                  with zipfile.ZipFile(zip_path, 'r') as z:
                      z.extractall("dist")
                  if extracted_files_exist():
                      print("platform-tools extracted and validated.")
                      break
                  missing = [path for path in required_files if not os.path.isfile(path)]
                  raise RuntimeError(f"Missing required platform-tools files: {missing}")
              except Exception as exc:
                  print(f"WARNING: platform-tools validation failed on attempt {attempt}/3: {exc}")
                  if os.path.exists(zip_path):
                      os.remove(zip_path)
                  if attempt >= 3 or not download_any(zip_path):
                      raise RuntimeError(
                          f"Required platform-tools files are still missing after retries: {required_files}\n"
                          + attempted_urls_message()
                      ) from exc

      # Download pinned scrcpy release asset for each OS.
      - name: Download scrcpy
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          import os
          import shutil
          import tarfile
          import time
          import urllib.error
          import urllib.request
          import zipfile

          arch = "${{ matrix.scrcpy_arch }}"
          ext = "${{ matrix.scrcpy_ext }}"
          version = "${{ env.SCRCPY_VERSION }}"
          token = os.environ.get("GH_TOKEN", "")
          cache_dir = os.path.join(".ci-cache", "scrcpy")
          os.makedirs(cache_dir, exist_ok=True)

          if ext == "tar.gz":
              asset_name = f"scrcpy-{arch}-{version}.tar.gz"
          else:
              asset_name = f"scrcpy-{arch}-{version}.{ext}"

          download_url = f"https://github.com/Genymobile/scrcpy/releases/download/{version}/{asset_name}"
          asset_path = os.path.join(cache_dir, asset_name)
          scrcpy_exe = "scrcpy.exe" if os.name == "nt" else "scrcpy"
          required_files = [os.path.join("dist", "scrcpy", scrcpy_exe)]

          def download_with_retries(download_url, output_path, attempts=3):
              headers = {"User-Agent": "DeadZone-CI"}
              # Token is optional. Direct public release assets do not require the GitHub API.
              # It is included only to make rate-limit/access-denial responses easier to diagnose.
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              for attempt in range(1, attempts + 1):
                  if os.path.exists(output_path):
                      os.remove(output_path)
                  try:
                      print(f"Downloading {download_url} (attempt {attempt}/{attempts})...")
                      req = urllib.request.Request(download_url, headers=headers)
                      with urllib.request.urlopen(req, timeout=60) as response:
                          with open(output_path, "wb") as target:
                              shutil.copyfileobj(response, target)
                      if os.path.getsize(output_path) <= 0:
                          raise RuntimeError(f"Downloaded file is empty: {output_path}")
                      return True
                  except urllib.error.HTTPError as exc:
                      print(f"WARNING: HTTP {exc.code} while downloading {download_url}: {exc.reason}")
                      if exc.code == 403:
                          print("WARNING: GitHub returned 403; retrying scrcpy download.")
                  except Exception as exc:
                      print(f"WARNING: download failed: {exc}")
                  if os.path.exists(output_path):
                      os.remove(output_path)
                  if attempt < attempts:
                      time.sleep(5 * attempt)
              return False

          def extracted_files_exist():
              return all(os.path.isfile(path) for path in required_files)

          if extracted_files_exist():
              print("scrcpy already extracted.")
              raise SystemExit(0)

          if not os.path.isfile(asset_path) or os.path.getsize(asset_path) <= 0:
              if not download_with_retries(download_url, asset_path):
                  raise RuntimeError(f"Required scrcpy archive could not be downloaded: {download_url}")
          else:
              print(f"Using cached {asset_path}")

          scrcpy_dir = os.path.join("dist", "scrcpy")
          os.makedirs(scrcpy_dir, exist_ok=True)

          for attempt in range(1, 4):
              shutil.rmtree(scrcpy_dir, ignore_errors=True)
              os.makedirs(scrcpy_dir, exist_ok=True)
              try:
                  if ext == "zip":
                      with zipfile.ZipFile(asset_path, 'r') as z:
                          for member in z.namelist():
                              filename = os.path.basename(member)
                              if not filename:
                                  continue
                              with z.open(member) as source:
                                  with open(os.path.join(scrcpy_dir, filename), "wb") as target:
                                      shutil.copyfileobj(source, target)
                  else:
                      with tarfile.open(asset_path, 'r:gz') as tar:
                          for member in tar.getmembers():
                              if member.isfile():
                                  member.name = os.path.basename(member.name)
                                  tar.extract(member, scrcpy_dir)
                  if extracted_files_exist():
                      print(f"Scrcpy {version} extracted and validated in dist/scrcpy/")
                      print(f"Files: {os.listdir(scrcpy_dir)}")
                      break
                  missing = [path for path in required_files if not os.path.isfile(path)]
                  raise RuntimeError(f"Missing required scrcpy files: {missing}")
              except Exception as exc:
                  print(f"WARNING: scrcpy validation failed on attempt {attempt}/3: {exc}")
                  if os.path.exists(asset_path):
                      os.remove(asset_path)
                  if attempt >= 3 or not download_with_retries(download_url, asset_path):
                      raise RuntimeError(f"Required scrcpy files are still missing after retries: {required_files}") from exc

      # Linux/macOS: chmod +x
      - name: Set executable permissions
        if: runner.os != 'Windows'
        run: |
          chmod +x dist/${{ matrix.exe_name }}
          if [ -f dist/platform-tools/adb ]; then
            chmod +x dist/platform-tools/adb
          fi
          if [ -f dist/platform-tools/fastboot ]; then
            chmod +x dist/platform-tools/fastboot
          fi
          if [ -f dist/scrcpy/scrcpy ]; then
            chmod +x dist/scrcpy/scrcpy
          fi

      # Copy config.json
      - name: Copy config
        shell: python
        run: |
          import shutil, os
          if os.path.exists("config.json"):
              shutil.copy2("config.json", "dist/config.json")

      # Debug: list dist contents
      - name: List dist contents
        run: |
          echo "=== dist/ contents ==="
          ls -R dist/ || dir /s dist\

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/
          retention-days: 30

  # ── Create Release ──
  # Run when pushing a tag OR when workflow_dispatch provides release_tag
  release:
    needs: build
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/')
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    permissions:
      contents: write

    steps:
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.release_tag }}" >> $GITHUB_OUTPUT
          fi
          echo "Release tag: $(cat $GITHUB_OUTPUT)"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: |
          echo "=== Artifact structure ==="
          ls -R artifacts/

      - name: Create ZIP packages
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            echo "Creating ${name}.zip..."
            cd "$name"
            zip -r "../../${name}.zip" .
            cd ..
          done
          cd ..
          echo "=== ZIP files ==="
          ls -la *.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "Release ${{ steps.tag.outputs.tag }}"
          files: "*.zip"
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN }}
